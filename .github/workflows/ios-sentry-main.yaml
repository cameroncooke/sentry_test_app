name: Sentry Main iOS Upload (Size Analysis Base Build)

on:
  push:
    branches: [main]
    paths: [ios/**]

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        working-directory: ./ios

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode 26.x
        shell: bash
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26.x not found on runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Set up Ruby env
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./ios
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build & upload base build to Sentry for size analysis
        run: bundle exec fastlane ios build_upload_sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
